<!doctype html>
<html lang="ar" dir="rtl"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فاحص بيانات الطلاب</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f6fb;color:#172033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1050px;margin:auto}
header{background:linear-gradient(135deg,#14213d,#2457a6);color:white;padding:25px;border-radius:18px;margin-bottom:18px}
h1{margin:0 0 8px;font-size:25px}.sub{opacity:.9;font-size:14px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0}
button{border:0;background:#2457a6;color:white;padding:12px 18px;border-radius:10px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.card,section{background:white;border:1px solid #e4eaf2;border-radius:15px;padding:17px}
.label{color:#66738a;font-size:13px}.num{font-size:28px;font-weight:bold;margin-top:7px}
input{width:100%;padding:12px;border:1px solid #dce3ef;border-radius:10px;margin:12px 0}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:right;padding:12px;border-bottom:1px solid #edf0f5;vertical-align:top}th{background:#f7f9fc;color:#536179;font-size:13px}.tag{display:inline-block;background:#fff2e8;color:#a64b0b;border-radius:7px;padding:5px 8px;margin:2px;font-size:12px}
#error{display:none;background:#fff1f0;color:#a42318;padding:12px;border-radius:10px;margin:12px 0}#status,footer{color:#66738a;font-size:13px}footer{text-align:center;margin:18px}
@media(max-width:650px){body{padding:12px}.cards{grid-template-columns:1fr}.num{font-size:24px}}
</style></head><body><div class="wrap">
<header><h1>فاحص بيانات الطلاب</h1><div class="sub">اكتشف الخانات الناقصة في بيانات الطلاب بسهولة</div></header>
<div class="bar"><div id="status">جاري قراءة الشيت...</div><button id="refresh" onclick="loadReport()">تحديث البيانات</button></div>
<div id="error"></div>
<div class="cards">
<div class="card"><div class="label">إجمالي الطلاب</div><div class="num" id="total">—</div></div>
<div class="card"><div class="label">طلاب لديهم بيانات ناقصة</div><div class="num" id="incomplete">—</div></div>
<div class="card"><div class="label">إجمالي الخانات الناقصة</div><div class="num" id="missing">—</div></div></div>
<section><h3>تفاصيل البيانات الناقصة</h3><input id="search" placeholder="ابحث باسم الطالب..." oninput="renderRows()">
<div class="tablewrap"><table><thead><tr><th>اسم الطالب</th><th>الأعمدة الناقصة</th><th>عدد الخانات</th></tr></thead><tbody id="rows"><tr><td colspan="3">جاري التحميل...</td></tr></tbody></table></div></section>
<footer id="foot"></footer></div>
<script>
let reportData=[];
function loadReport(){
 const btn=document.getElementById('refresh'),err=document.getElementById('error');btn.disabled=true;err.style.display='none';document.getElementById('status').textContent='جاري قراءة بيانات الشيت...';
 google.script.run.withSuccessHandler(data=>{
 reportData=data.students||[];document.getElementById('total').textContent=data.total;document.getElementById('incomplete').textContent=data.incomplete;document.getElementById('missing').textContent=data.missingCells;
 document.getElementById('status').textContent='الشيت: '+data.sheetName+' — تم تحديث البيانات';document.getElementById('foot').textContent='آخر تحديث: '+new Date(data.updatedAt||Date.now()).toLocaleString('ar-EG');renderRows();btn.disabled=false;
 }).withFailureHandler(e=>{err.textContent='تعذر قراءة الشيت: '+(e.message||e);err.style.display='block';document.getElementById('status').textContent='حدث خطأ أثناء القراءة';btn.disabled=false;}).getReport();
}
function renderRows(){
 const q=document.getElementById('search').value.trim().toLowerCase(),body=document.getElementById('rows');
 const filtered=reportData.filter(s=>s.name.toLowerCase().includes(q));
 if(!filtered.length){body.innerHTML='<tr><td colspan="3">لا توجد نتائج مطابقة.</td></tr>';return;}
 body.innerHTML=filtered.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+s.missing.map(x=>'<span class="tag">'+esc(x)+'</span>').join(' ')+'</td><td>'+s.missing.length+'</td></tr>').join('');
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.addEventListener('load',loadReport);
</script></body></html>
